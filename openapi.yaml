openapi: 3.1.0
info:
  title: Koli Parts API
  version: 0.1.0
  description: >-
    Contract-first MVP API. Supplier procurement endpoints are internal abstractions;
    they do not imply eBay Order API production access.
servers:
  - url: http://localhost:4000
    description: local
  - url: https://api.koli-one.com
    description: production-proposed
security:
  - cookieAuth: []
tags:
  - name: Auth
  - name: Vehicles
  - name: Search
  - name: Products
  - name: Quotes
  - name: Orders
  - name: Procurement
  - name: Webhooks
  - name: Admin
paths:
  /health:
    get:
      security: []
      operationId: health
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
  /auth/koli-one/exchange:
    post:
      tags: [Auth]
      security: []
      summary: Exchange a verified short-lived Koli One identity assertion for a Koli Parts session
      operationId: exchangeKoliOneAssertion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assertion]
              properties:
                assertion: { type: string, minLength: 20 }
      responses:
        '200':
          description: Session established
          headers:
            Set-Cookie:
              description: Secure HttpOnly Koli Parts session cookie and readable signed CSRF cookie
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/me:
    get:
      tags: [Auth]
      summary: Return the current Koli Parts session user
      operationId: getCurrentUser
      responses:
        '200':
          description: Current session user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current Koli Parts session
      operationId: logout
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204': { description: Session revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /vehicles:
    get:
      tags: [Vehicles]
      operationId: listVehicles
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: User vehicles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Vehicle' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Vehicles]
      operationId: createVehicle
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateVehicle' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '400': { description: Invalid vehicle payload }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /vehicles/{vehicleId}:
    get:
      tags: [Vehicles]
      operationId: getVehicle
      parameters:
        - in: path
          name: vehicleId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: User vehicle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '400': { description: Invalid vehicle id }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Vehicle not found }
    patch:
      tags: [Vehicles]
      operationId: updateVehicle
      parameters:
        - in: path
          name: vehicleId
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateVehicle' }
      responses:
        '200':
          description: Updated vehicle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '400': { description: Invalid vehicle update }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Vehicle not found }
    delete:
      tags: [Vehicles]
      operationId: deleteVehicle
      parameters:
        - in: path
          name: vehicleId
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Deleted vehicle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '400': { description: Invalid vehicle id }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Vehicle not found }
        '409': { description: Vehicle is in use by cart or order records }
  /vehicles/{vehicleId}/default:
    post:
      tags: [Vehicles]
      operationId: setDefaultVehicle
      parameters:
        - in: path
          name: vehicleId
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Default vehicle updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '400': { description: Invalid vehicle id }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Vehicle not found }
  /vehicles/parse-vin:
    post:
      tags: [Vehicles]
      operationId: parseVin
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vin]
              properties:
                vin: { type: string, minLength: 17, maxLength: 17 }
      responses:
        '200':
          description: Decoded vehicle candidate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleCandidate' }
        '400': { description: Invalid VIN payload }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { description: VIN provider unavailable }
  /search:
    get:
      tags: [Search]
      operationId: searchParts
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 1 }
        - in: query
          name: vehicleId
          schema: { type: string, format: uuid }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: Search result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResponse' }
  /products/{productId}:
    get:
      tags: [Products]
      operationId: getProduct
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - in: query
          name: vehicleId
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
  /quotes:
    post:
      tags: [Quotes]
      operationId: createQuote
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, shippingAddress]
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [supplierListingId, quantity]
                    properties:
                      supplierListingId: { type: string, format: uuid }
                      vehicleId: { type: string, format: uuid }
                      quantity: { type: integer, minimum: 1 }
                shippingAddress: { type: object, additionalProperties: true }
      responses:
        '201':
          description: Expiring quote
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '409':
          description: Listing changed/unavailable or invalid fitment policy
  /orders:
    post:
      tags: [Orders]
      operationId: createOrder
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quoteId, paymentMethodRef]
              properties:
                quoteId: { type: string, format: uuid }
                paymentMethodRef: { type: string }
      responses:
        '201':
          description: Order created/payment authorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
  /orders/{orderId}:
    get:
      tags: [Orders]
      operationId: getOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
  /admin/procurements:
    get:
      tags: [Admin, Procurement]
      operationId: listProcurementQueue
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [PENDING, REVIEW] }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Bounded procurement review queue
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcurementQueue' }
        '400': { description: Invalid queue query }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Requires procurement_operator, admin, or super_admin role }
  /admin/procurements/{procurementId}/approve:
    post:
      tags: [Admin, Procurement]
      operationId: approveProcurement
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - in: path
          name: procurementId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3 }
      responses:
        '200':
          description: Approved; execution remains capability-gated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcurementApproval' }
        '400': { description: Invalid approval request }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Requires procurement_operator, admin, or super_admin role }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Invalid state transition or idempotency key reuse mismatch }
  /webhooks/stripe:
    post:
      tags: [Webhooks]
      security: []
      operationId: stripeWebhook
      responses:
        '200': { description: Accepted or already processed }
        '400': { description: Invalid signature/payload }
  /webhooks/ebay:
    post:
      tags: [Webhooks]
      security: []
      operationId: ebayWebhook
      description: Reserved for verified eBay notification types actually enabled for the approved integration.
      responses:
        '200': { description: Accepted or already processed }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: kp_session
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 16, maxLength: 200 }
    CsrfToken:
      in: header
      name: X-CSRF-Token
      required: true
      description: Must match the readable signed CSRF cookie issued with the session.
      schema: { type: string, minLength: 20 }
    ProductId:
      in: path
      name: productId
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      in: path
      name: orderId
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized: { description: Unauthorized }
    NotFound: { description: Not found }
  schemas:
    AuthSession:
      type: object
      required: [userId, roles]
      properties:
        userId: { type: string, format: uuid }
        preferredLanguage: { type: string, enum: [bg, en] }
        roles:
          type: array
          items: { type: string }
        expiresAt: { type: string, format: date-time }
    CreateVehicle:
      type: object
      required: [make, model]
      additionalProperties: false
      properties:
        vin: { type: string, minLength: 17, maxLength: 17 }
        make: { type: string, minLength: 1, maxLength: 80 }
        model: { type: string, minLength: 1, maxLength: 120 }
        productionYear: { type: integer, minimum: 1886, maximum: 2200 }
        engineCode: { type: string, minLength: 1, maxLength: 80 }
    UpdateVehicle:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        vin: { type: string, minLength: 17, maxLength: 17 }
        make: { type: string, minLength: 1, maxLength: 80 }
        model: { type: string, minLength: 1, maxLength: 120 }
        productionYear: { type: integer, minimum: 1886, maximum: 2200 }
        engineCode: { type: string, minLength: 1, maxLength: 80 }
    Vehicle:
      allOf:
        - $ref: '#/components/schemas/CreateVehicle'
        - type: object
          required: [id, isDefault, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            isDefault: { type: boolean }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    VehicleCandidate:
      type: object
      properties:
        provider: { type: string }
        vehicle: { $ref: '#/components/schemas/CreateVehicle' }
        confidence: { type: string, enum: [high, medium, low] }
    Money:
      type: object
      required: [amountMinor, currency]
      properties:
        amountMinor: { type: integer, minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
    Fitment:
      type: object
      required: [status, ruleScore, evidence]
      properties:
        status:
          type: string
          enum: [CONFIRMED_FIT, HIGH_CONFIDENCE, VERIFY_OEM, UNKNOWN, NOT_COMPATIBLE]
        ruleScore: { type: number, minimum: 0, maximum: 100 }
        calibratedProbability: { type: [number, 'null'], minimum: 0, maximum: 1 }
        evidence:
          type: array
          items: { type: object, additionalProperties: true }
        warnings:
          type: array
          items: { type: string }
    SearchItem:
      type: object
      required: [productId, title, price, fitment]
      properties:
        productId: { type: string, format: uuid }
        title: { type: string }
        brand: { type: string }
        price: { $ref: '#/components/schemas/Money' }
        fitment: { $ref: '#/components/schemas/Fitment' }
    SearchResponse:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SearchItem' }
        page: { type: integer }
        total: { type: integer }
        facets: { type: object, additionalProperties: true }
    ProductDetail:
      type: object
      required: [id, title, offers]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        oemNumbers: { type: array, items: { type: string } }
        fitment: { $ref: '#/components/schemas/Fitment' }
        offers:
          type: array
          items:
            type: object
            properties:
              supplierListingId: { type: string, format: uuid }
              supplier: { type: string }
              price: { $ref: '#/components/schemas/Money' }
    Quote:
      type: object
      required: [id, total, expiresAt]
      properties:
        id: { type: string, format: uuid }
        total: { $ref: '#/components/schemas/Money' }
        expiresAt: { type: string, format: date-time }
        breakdown: { type: object, additionalProperties: true }
    Order:
      type: object
      required: [id, status, total]
      properties:
        id: { type: string, format: uuid }
        status: { type: string }
        total: { $ref: '#/components/schemas/Money' }
    ProcurementApproval:
      type: object
      required: [procurementId, status, approvedBy, approvedAt, idempotentReplay]
      properties:
        procurementId: { type: string, format: uuid }
        status: { type: string, const: APPROVED }
        approvedBy: { type: string, format: uuid }
        approvedAt: { type: string, format: date-time }
        idempotentReplay: { type: boolean }
    ProcurementQueue:
      type: object
      required: [items, limit]
      properties:
        limit: { type: integer, minimum: 1, maximum: 100 }
        items:
          type: array
          items: { $ref: '#/components/schemas/ProcurementQueueItem' }
    ProcurementQueueItem:
      type: object
      required:
        - procurementId
        - orderId
        - procurementStatus
        - orderStatus
        - supplier
        - totalMinor
        - currency
        - createdAt
        - updatedAt
      properties:
        procurementId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        procurementStatus: { type: string, enum: [PENDING, REVIEW] }
        orderStatus: { type: string }
        supplier: { type: string }
        totalMinor: { type: integer, minimum: 0 }
        currency: { type: string, const: EUR }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
